<path d="M302.0,121.0 Q329.0,111.0 356.0,121.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M636.0,121.0 Q663.0,111.0 690.0,121.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M830.0,180.0 C830.0,220.0 162.0,194.0 162.0,234.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M302.0,293.0 Q329.0,283.0 356.0,293.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
