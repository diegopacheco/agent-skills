<svg xmlns="http://www.w3.org/2000/svg" width="992" height="374" viewBox="0 0 992 374">
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
.h { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 30px; font-weight: 700; fill: #222; }
.t { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 22px; font-weight: 700; fill: #222; text-anchor: middle; }
.s { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 17px; fill: #333; text-anchor: middle; }
</style>
<defs>
<filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#333"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fffdf7"/>
<text x="30" y="42" class="h">Skill Contract Testing: conventional-commit</text>
<rect x="30.0" y="70" width="264.0" height="102" rx="14" fill="#ffe8a3" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="162.0" y="108" class="t">Contract</text>
<text x="162.0" y="130" class="s">written in</text>
<text x="162.0" y="150" class="s">SKILL.md</text>
<rect x="364.0" y="70" width="264.0" height="102" rx="14" fill="#c9f2d0" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="496.0" y="108" class="t">check_contract.py</text>
<text x="496.0" y="130" class="s">header, case, period,</text>
<text x="496.0" y="150" class="s">body, breaking footer</text>
<rect x="698.0" y="70" width="264.0" height="102" rx="14" fill="#cfe3ff" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="830.0" y="108" class="t">evals/contract.json</text>
