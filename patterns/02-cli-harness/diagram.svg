<path d="M617.0,121.0 Q644.0,111.0 671.0,121.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M806.2,180.0 C806.2,220.0 157.2,194.0 157.2,234.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M292.5,293.0 Q319.5,283.0 346.5,293.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
