<svg xmlns="http://www.w3.org/2000/svg" width="992" height="374" viewBox="0 0 992 374">
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
.h { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 30px; font-weight: 700; fill: #222; }
.t { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 22px; font-weight: 700; fill: #222; text-anchor: middle; }
.s { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 17px; fill: #333; text-anchor: middle; }
</style>
<defs>
<filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#333"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fffdf7"/>
<text x="30" y="42" class="h">Progressive Disclosure: sql-migration</text>
<rect x="30.0" y="70" width="264.0" height="102" rx="14" fill="#ffe8a3" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="162.0" y="108" class="t">Level 1: metadata</text>
<text x="162.0" y="130" class="s">name + description</text>
<text x="162.0" y="150" class="s">always in context</text>
<rect x="364.0" y="70" width="264.0" height="102" rx="14" fill="#c9f2d0" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="496.0" y="108" class="t">Level 2: SKILL.md</text>
<text x="496.0" y="130" class="s">loaded when the</text>
<text x="496.0" y="150" class="s">skill is picked</text>
<rect x="698.0" y="70" width="264.0" height="102" rx="14" fill="#cfe3ff" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="830.0" y="108" class="t">Level 3: one engine</text>
<text x="830.0" y="130" class="s">postgres.md or mysql.md</text>
<text x="830.0" y="150" class="s">or sqlite.md, never all</text>
<rect x="30.0" y="242" width="264.0" height="102" rx="14" fill="#ffd6e0" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="162.0" y="280" class="t">rollback.md</text>
<text x="162.0" y="302" class="s">only for drops,</text>
<text x="162.0" y="322" class="s">renames, rewrites</text>
<path d="M302.0,121.0 Q329.0,111.0 356.0,121.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M636.0,121.0 Q663.0,111.0 690.0,121.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M830.0,180.0 C830.0,220.0 162.0,194.0 162.0,234.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
