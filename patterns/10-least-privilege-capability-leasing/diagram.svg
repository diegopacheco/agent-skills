<svg xmlns="http://www.w3.org/2000/svg" width="906" height="374" viewBox="0 0 906 374">
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
.h { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 30px; font-weight: 700; fill: #222; }
.t { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 22px; font-weight: 700; fill: #222; text-anchor: middle; }
.s { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 17px; fill: #333; text-anchor: middle; }
</style>
<defs>
<filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#333"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fffdf7"/>
<text x="30" y="42" class="h">Capability Leasing: log-cleanup</text>
<rect x="30.0" y="70" width="235.5" height="102" rx="14" fill="#ffe8a3" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="147.8" y="108" class="t">allowed-tools</text>
<text x="147.8" y="130" class="s">3 exact commands,</text>
<text x="147.8" y="150" class="s">only while active</text>
<rect x="335.5" y="70" width="235.5" height="102" rx="14" fill="#c9f2d0" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="453.2" y="108" class="t">Measure + list</text>
<text x="453.2" y="130" class="s">du, find -print</text>
<text x="453.2" y="150" class="s">inside ./logs</text>
<rect x="641.0" y="70" width="235.5" height="102" rx="14" fill="#cfe3ff" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="758.8" y="108" class="t">User approves</text>
<text x="758.8" y="130" class="s">dry run shown first</text>
<rect x="30.0" y="242" width="235.5" height="102" rx="14" fill="#ffd6e0" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="147.8" y="280" class="t">Delete</text>
<text x="147.8" y="302" class="s">find -mtime +7</text>
<text x="147.8" y="322" class="s">-delete, nothing else</text>
<rect x="335.5" y="242" width="235.5" height="102" rx="14" fill="#e6d9ff" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="453.2" y="280" class="t">Anything else</text>
<text x="453.2" y="302" class="s">back to the normal</text>
<text x="453.2" y="322" class="s">permission prompt</text>
<path d="M273.5,121.0 Q300.5,111.0 327.5,121.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M579.0,121.0 Q606.0,111.0 633.0,121.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M758.8,180.0 C758.8,220.0 147.8,194.0 147.8,234.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M273.5,293.0 Q300.5,283.0 327.5,293.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
