<svg xmlns="http://www.w3.org/2000/svg" width="850" height="374" viewBox="0 0 850 374">
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
.h { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 30px; font-weight: 700; fill: #222; }
.t { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 22px; font-weight: 700; fill: #222; text-anchor: middle; }
.s { font-family: Caveat, 'Comic Sans MS', cursive; font-size: 17px; fill: #333; text-anchor: middle; }
</style>
<defs>
<filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#333"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fffdf7"/>
<text x="30" y="42" class="h">Plan-Execute-Verify: verified-change</text>
<rect x="30.0" y="70" width="216.5" height="102" rx="14" fill="#ffe8a3" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="138.2" y="108" class="t">Plan</text>
<text x="138.2" y="130" class="s">plan.md, one</text>
<text x="138.2" y="150" class="s">check per step</text>
<rect x="316.5" y="70" width="216.5" height="102" rx="14" fill="#c9f2d0" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="424.8" y="108" class="t">Execute</text>
<text x="424.8" y="130" class="s">exactly one step</text>
<rect x="603.0" y="70" width="216.5" height="102" rx="14" fill="#cfe3ff" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="711.2" y="108" class="t">Verify</text>
<text x="711.2" y="130" class="s">run the check,</text>
<text x="711.2" y="150" class="s">repair once</text>
<rect x="30.0" y="242" width="216.5" height="102" rx="14" fill="#ffd6e0" stroke="#333" stroke-width="2" filter="url(#wobble)"/>
<text x="138.2" y="280" class="t">Done</text>
<text x="138.2" y="302" class="s">every row done</text>
<text x="138.2" y="322" class="s">+ final suite green</text>
<path d="M254.5,121.0 Q281.5,111.0 308.5,121.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M541.0,121.0 Q568.0,111.0 595.0,121.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M711.2,180.0 C711.2,220.0 138.2,194.0 138.2,234.0" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
