<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Night Agents</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9f9f7;
        color: #0b0b0b;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
      }
      .box {
        width: 420px;
        background: #fff;
        border: 1px solid rgba(11, 11, 11, 0.1);
        border-radius: 14px;
        padding: 24px;
      }
      .head {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }
      .head img {
        width: 44px;
        height: 44px;
      }
      .step {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 0;
      }
      .mark {
        width: 18px;
        text-align: center;
        font-weight: 700;
      }
      .wait .mark { color: #898781; }
      .busy .mark { color: #2a78d6; }
      .ok .mark { color: #006300; }
      .error .mark { color: #d03b3b; }
      .detail {
        margin-left: auto;
        color: #52514e;
        font-size: 12px;
        max-width: 220px;
        text-align: right;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="head"><img src="resources/icon.png" alt="" /><div><strong>Night Agents</strong><div style="color:#898781;font-size:12px">starting</div></div></div>
      <div id="steps"></div>
    </div>
    <script>
      const steps = [
        ["core", "Night agents core"],
        ["runs", "Runs folder"],
        ["index", "Indexing runs and branches"],
        ["ui", "Interface"],
      ];
      const marks = { wait: "○", busy: "◔", ok: "✓", error: "✕" };
      const state = Object.fromEntries(steps.map(([id]) => [id, { status: "wait", detail: "" }]));
      function draw() {
        document.getElementById("steps").innerHTML = steps
          .map(([id, label]) => `<div class="step ${state[id].status}"><span class="mark">${marks[state[id].status]}</span>${label}<span class="detail">${state[id].detail}</span></div>`)
          .join("");
      }
      window.nightDesktop.on("boot", (msg) => {
        state[msg.step] = { status: msg.status, detail: msg.detail || "" };
        draw();
      });
      draw();
    </script>
  </body>
</html>
