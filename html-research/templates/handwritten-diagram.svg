      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1b19"/>
    </marker>
  </defs>
  <g filter="url(#rough1)" fill="none" stroke="#1c1b19" stroke-width="2" stroke-linecap="round"
     font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="14">
    <rect x="20" y="70" width="160" height="70" rx="10" fill="#ffffff"/>
    <text x="100" y="102" text-anchor="middle" fill="#1c1b19" stroke="none">Client</text>
    <text x="100" y="121" text-anchor="middle" fill="#6b6862" stroke="none" font-size="12">sends request</text>

    <rect x="300" y="70" width="160" height="70" rx="10" fill="#fbeee8" stroke="#c0552f"/>
    <text x="380" y="102" text-anchor="middle" fill="#c0552f" stroke="none">Limiter</text>
    <text x="380" y="121" text-anchor="middle" fill="#6b6862" stroke="none" font-size="12">token bucket</text>

    <rect x="580" y="70" width="160" height="70" rx="10" fill="#ffffff"/>
    <text x="660" y="102" text-anchor="middle" fill="#1c1b19" stroke="none">Service</text>
    <text x="660" y="121" text-anchor="middle" fill="#6b6862" stroke="none" font-size="12">does the work</text>

    <path d="M182 105 L296 105" marker-end="url(#ah1)"/>
    <path d="M462 105 L576 105" marker-end="url(#ah1)"/>
    <text x="239" y="94" text-anchor="middle" fill="#6b6862" stroke="none" font-size="12">1</text>
    <text x="519" y="94" text-anchor="middle" fill="#6b6862" stroke="none" font-size="12">2 allow</text>

    <path d="M380 148 L380 190" marker-end="url(#ah1)"/>
    <text x="392" y="176" fill="#6b6862" stroke="none" font-size="12">3 reject 429</text>
